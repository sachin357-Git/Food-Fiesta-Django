{% extends 'base.html' %}
{% load static %}

{% block childpage %}

<div class="row py-5">

    <div class="col-sm-5 mx-auto">

        <div class="card shadow-lg p-4 rounded-4 border-0">

            <div class="text-center mb-3">
                <i class="fa-solid fa-user-plus text-danger fs-1"></i>
            </div>


            <h1 class="text-center fw-bold">
                Create Account
            </h1>

            <p class="text-center text-muted">
                Register to book your favourite food
            </p>


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="fw-bold">
                        Full Name
                    </label>

                    <input type="text"
                    name="name"
                    class="form-control rounded-pill"
                    placeholder="Enter your name"
                    required>

                </div>



                <div class="mb-3">

                    <label class="fw-bold">
                        Email Address
                    </label>

                    <input type="email"
                    name="email"
                    class="form-control rounded-pill"
                    placeholder="Enter your email"
                    required>

                </div>



                <div class="mb-3">

                    <label class="fw-bold">
                        Password
                    </label>

                    <input type="password"
                    name="password"
                    class="form-control rounded-pill"
                    placeholder="Create password"
                    required>

                </div>



                <div class="mb-3">

                    <label class="fw-bold">
                        Confirm Password
                    </label>

                    <input type="password"
                    name="confirm_password"
                    class="form-control rounded-pill"
                    placeholder="Confirm password"
                    required>

                </div>



                <div class="text-center mt-4">

                    <button type="submit"
                    class="btn btn-danger px-5 rounded-pill">

                        Register

                    </button>

                </div>



                <p class="text-center mt-4">

                    Already have an account?

                    <a href="/login/"
                    class="text-danger fw-bold">

                        Login

                    </a>

                </p>


            </form>


        </div>

    </div>

</div>


{% endblock %}
